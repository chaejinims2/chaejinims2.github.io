name: Build and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      cweb_ref:
        description: "cweb git ref to publish"
        required: false
        default: "release"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cweb
        uses: actions/checkout@v5
        with:
          repository: chaejinims2/cweb
          ref: ${{ inputs.cweb_ref || 'release' }}
          path: cweb
          submodules: recursive
          token: ${{ secrets.CWEB_SUBMODULES_PAT }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cweb/package-lock.json

      - name: Render pages
        working-directory: cweb
        run: |
          npm ci
          npm run render-pages

      - name: Inspect public output
        working-directory: cweb
        run: |
          echo "Public size summary:"
          du -sh public
          echo "Top large files in public:"
          find public -type f -printf '%s %p\n' | sort -nr | head -n 20

      - name: Remove dev project files from public
        run: |
          find cweb/public -type d \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -prune -exec rm -rf {} +

      - name: Verify artifact size before upload
        run: |
          size=$(du -sb cweb/public | cut -f1)
          max=$((1024 * 1024 * 1024))
          echo "Artifact size (bytes): $size"
          if [ "$size" -gt "$max" ]; then
            echo "ERROR: cweb/public is larger than 1 GiB, the GitHub Pages limit."
            exit 1
          fi

      - name: Mark as static site
        run: touch cweb/public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: cweb/public
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
